name: Docker Image Dev CI

concurrency:
  group: "build"
  cancel-in-progress: false

on:
  push:
    branches: [ "dev" ]

# The jobs only check out the code; the images are pushed with the Docker Hub secrets.
permissions:
  contents: read

jobs:

  Build-and-Push:

    runs-on: dal-1

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    # The web server, ban importer, and Discord bot are built on Docker Hardened Images, which are pulled from dhi.io.
    - name: Login to Docker Hardened Images
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build Docker image for the web server
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
          context: .
          file: web-server/Dockerfile
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cblwebserver:dev
          provenance: true

    - name: Build Docker image for the ban importer
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
          context: .
          file: ban-importer/Dockerfile
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cblimporter:dev
          provenance: true

    - name: Build Docker image for the Discord bot
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
          context: .
          file: discord-bot/Dockerfile
          tags: werewolfboy13/cbl-bot:dev
          provenance: true

    - name: Push image for the web server
      if: success()
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
          context: .
          file: web-server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cblwebserver:dev-latest
          provenance: true

  #   - name: Update Web Server Deployment
  #     if: success()
  #     continue-on-error: true
  #     run: cd /opt/Communitybanlist && sh webstart-fromgit.sh

    - name: Push image for the ban importer
      if: success()
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
          context: .
          file: ban-importer/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cblimporter:dev-latest
          provenance: true

    - name: Push image for the Discord bot
      if: success()
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
          context: .
          file: discord-bot/Dockerfile
          push: true
          tags: werewolfboy13/cbl-bot:dev-latest
          provenance: true
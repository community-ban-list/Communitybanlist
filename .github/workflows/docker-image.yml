name: Docker Image CI

concurrency:
  group: "build"
  cancel-in-progress: false

on:
  push:
    branches: [ "master" ]

jobs:

  Build-and-Push:

    runs-on: dal-1

    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.2

    - name: Login to Docker Hub
      uses: docker/login-action@v3.3.0
      with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    # The Discord bot and ban importer are built on Docker Hardened Images, which are pulled from dhi.io.
    - name: Login to Docker Hardened Images
      uses: docker/login-action@v3.3.0
      with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3.3.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3.8.0

    - name: Build and push Docker image for the web server
      uses: docker/build-push-action@v6.11.0
      with:
          context: .
          file: web-server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cblwebserver:latest
          provenance: true

    - name: Update Web Server Deployment
      if: success()
      continue-on-error: true
      env:
        # The Portainer webhook URL that redeploys the web server.
        WEBHOOK_URL: ${{ secrets.WEB_SERVER_LAUNCH }}
      run: |
        case "$WEBHOOK_URL" in
          http://*|https://*) ;;
          *) echo "::error::The WEB_SERVER_LAUNCH secret must be the Portainer webhook URL."; exit 1 ;;
        esac

        trigger() {
          curl --fail --silent --show-error --max-time 60 --request POST "$@" "$WEBHOOK_URL"
        }

        status=0
        trigger || status=$?

        # Portainer's certificate can fail verification from the runner, e.g. when it has expired.
        # Still trigger the deployment then, by retrying without checking the certificate.
        case "$status" in
          0) ;;
          35|51|58|60|77|83|90|91)
            echo "::warning title=Portainer certificate::The deployment webhook failed certificate verification (curl exit code $status), so it was retried without checking the certificate."
            trigger --insecure
            ;;
          *) exit "$status" ;;
        esac

    - name: Build and push Docker image for the ban importer
      uses: docker/build-push-action@v6.11.0
      with:
          context: .
          file: ban-importer/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cblimporter:latest
          provenance: true

    - name: Build and push Docker image for the Discord bot
      uses: docker/build-push-action@v6.11.0
      with:
          context: .
          file: discord-bot/Dockerfile
          push: true
          tags: werewolfboy13/cbl-bot:latest
          provenance: true

name: Docker Image CI

# Runs are grouped by workflow and branch, so a push to another branch never cancels a pending build
# and deploy of master. A newer push to master still replaces a master run that has not started.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [ "master" ]

# The jobs only check out the code; the images are pushed with the Docker Hub secrets.
permissions:
  contents: read

jobs:

  Build-and-Push:

    runs-on: dal-1

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    # The web server, ban importer, and Discord bot are built on Docker Hardened Images, which are pulled from dhi.io.
    - name: Login to Docker Hardened Images
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Each image is also tagged with the commit it was built from, e.g. sha-1a2b3c4, so a service can
    # be pinned to a known build and rolled back by running the previous tag.
    - name: Name the commit's image tag
      id: commit
      run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

    # The images are built only for the runner's own platform, so no emulators are needed. Buildx runs
    # BuildKit in a container, which the attestations need. That image, and the SBOM scanner the build
    # and push steps name, are pinned by digest like the actions, so every build uses the same known
    # releases. Dependabot does not update these two pins, so bump them by hand.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

    # Build and test all three images before pushing any, so a failing test in one image cannot leave
    # the others pushed for a commit that failed. Their SBOMs are generated here too, for the same
    # reason. The push steps reuse the builds and SBOMs from the cache.
    - name: Build and test the Docker image for the web server
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
          context: .
          file: web-server/Dockerfile
          push: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cblwebserver:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cblwebserver:${{ steps.commit.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: true
          sbom: generator=docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315

    - name: Build and test the Docker image for the ban importer
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
          context: .
          file: ban-importer/Dockerfile
          push: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cblimporter:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cblimporter:${{ steps.commit.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: true
          sbom: generator=docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315

    - name: Build and test the Docker image for the Discord bot
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
          context: .
          file: discord-bot/Dockerfile
          push: false
          tags: |
            werewolfboy13/cbl-bot:latest
            werewolfboy13/cbl-bot:${{ steps.commit.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: true
          sbom: generator=docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315

    - name: Push the Docker image for the web server
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
          context: .
          file: web-server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cblwebserver:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cblwebserver:${{ steps.commit.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: true
          sbom: generator=docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315

    - name: Push the Docker image for the ban importer
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
          context: .
          file: ban-importer/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cblimporter:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cblimporter:${{ steps.commit.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: true
          sbom: generator=docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315

    - name: Push the Docker image for the Discord bot
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
          context: .
          file: discord-bot/Dockerfile
          push: true
          tags: |
            werewolfboy13/cbl-bot:latest
            werewolfboy13/cbl-bot:${{ steps.commit.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: true
          sbom: generator=docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315

    # The Portainer webhook redeploys the web server and the Discord bot, so it runs after all the
    # images are pushed. Otherwise the bot is redeployed before its new image exists.
    - name: Redeploy the web server and Discord bot
      if: success()
      continue-on-error: true
      env:
        # The Portainer webhook URL that redeploys the web server and the Discord bot.
        WEBHOOK_URL: ${{ secrets.WEB_SERVER_LAUNCH }}
      run: |
        case "$WEBHOOK_URL" in
          http://*|https://*) ;;
          *) echo "::error::The WEB_SERVER_LAUNCH secret must be the Portainer webhook URL."; exit 1 ;;
        esac

        trigger() {
          curl --fail --silent --show-error --max-time 60 --request POST "$@" "$WEBHOOK_URL"
        }

        status=0
        trigger || status=$?

        # Portainer's certificate can fail verification from the runner, e.g. when it has expired.
        # Still trigger the deployment then, by retrying without checking the certificate.
        case "$status" in
          0) ;;
          35|51|58|60|77|83|90|91)
            echo "::warning title=Portainer certificate::The deployment webhook failed certificate verification (curl exit code $status), so it was retried without checking the certificate."
            trigger --insecure
            ;;
          *) exit "$status" ;;
        esac
